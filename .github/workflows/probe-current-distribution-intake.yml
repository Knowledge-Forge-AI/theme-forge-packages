name: Current Distribution Key-Free Container Intake Observation
# Preparation only until separately adopted for one bounded invocation.
# Existing admitted image, read-only job token; no signer worker or secrets.
on:
  workflow_dispatch:
permissions: {}
jobs:
  intake:
    if: github.repository == 'Knowledge-Forge-AI/theme-forge-packages' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout exact probe source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: probe
          persist-credentials: false
      - name: Check pure disclosure and lifecycle contracts
        run: |
          /usr/bin/python3 -I -B probe/tests/test_current_distribution_intake_probe.py
          /usr/bin/python3 -I -B probe/tests/test_container_distribution_intake_probe.py
      - name: Checkout frozen baseline P source and image inputs
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 3783fff1376b5698dcce6fbbae903fba12580cc9
          path: p
          persist-credentials: false
      - name: Checkout frozen original R source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Knowledge-Forge-AI/release-starport-9
          ref: 42942b2d0f60059102c3baf43c5045e1ff42da7e
          path: r
          persist-credentials: false
      - name: Observe collection in the admitted runtime image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -m 0700 "$RUNNER_TEMP/tf-keyfree-container-result-$GITHUB_RUN_ID"
          /usr/bin/python3 -I -B probe/tools/verification/probe_container_distribution_intake.py \
            --p-root "$GITHUB_WORKSPACE/p" --r-root "$GITHUB_WORKSPACE/r" \
            --observer-root "$GITHUB_WORKSPACE/probe" \
            --work-root "$RUNNER_TEMP/tf-keyfree-container-image-$GITHUB_RUN_ID" \
            --export-root "$RUNNER_TEMP/tf-keyfree-container-export-$GITHUB_RUN_ID" \
            --result-out "$RUNNER_TEMP/tf-keyfree-container-result-$GITHUB_RUN_ID/RESULT.json" >/dev/null 2>&1
      - name: Retain only the closed diagnostic result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: keyfree-container-distribution-intake-${{ github.run_id }}
          path: ${{ runner.temp }}/tf-keyfree-container-result-${{ github.run_id }}/RESULT.json
          if-no-files-found: warn
          retention-days: 7
