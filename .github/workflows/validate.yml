name: Current P Nix Native Three Candidate Qualification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  current-nix:
    # Runnable private proposal; source review precedes any remote activation.
    if: ${{ github.repository == 'Knowledge-Forge-AI/theme-forge-packages' }}
    name: P native Nix ${{ matrix.system }} (candidate only)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: aarch64-darwin
            runner: macos-15
    defaults:
      run:
        shell: bash
        working-directory: p
    steps:
      - name: Checkout exact P candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: p
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
      - name: Authenticate held candidate without publication authority
        run: |
          set -euo pipefail
          node tools/verification/fetch-locked-assets.mjs --candidate-validation --lock release-lock.json --dest "$RUNNER_TEMP/p-current-assets"
          node tools/verification/verify-release-lock.mjs --candidate-validation release-lock.json --require-assets --assets-dir "$RUNNER_TEMP/p-current-assets"
      - name: Install existing Nix installer class
        uses: DeterminateSystems/nix-installer-action@e50d5f73bfe71c2dd0aa4218de8f4afa59f8f81d # v16
      - name: Checkout actual current tagged Nebular qualification source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Knowledge-Forge-AI/theme-forge-nebular-fusion
          ref: cadb40c4972f68f314096ff60fbcfb4da950c161
          path: nebular
          persist-credentials: false
      - name: Authenticate current Nebular commit and tree
        run: |
          set -euo pipefail
          test "$(git -C ../nebular rev-parse HEAD)" = cadb40c4972f68f314096ff60fbcfb4da950c161
          test "$(git -C ../nebular rev-parse 'HEAD^{tree}')" = 27c643b6375c2aafde314799c4f08e844c14992c
      - name: P recipe, wrapper, closure, native-addon and adapted GUI qualification
        env:
          P_SYSTEM: ${{ matrix.system }}
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == Linux ]]; then
            # Exact RS9 restoration/control flow; only repository admission differs for owner review.
            mkdir -p "$RUNNER_TEMP/p-nix-evidence"
            command -v xvfb-run | tee "$RUNNER_TEMP/p-nix-evidence/xvfb-prerequisite.log"
            command -v dbus-run-session | tee "$RUNNER_TEMP/p-nix-evidence/dbus-prerequisite.log"
            bash .github/scripts/p-linux-userns-apparmor-guard.sh -- \
              xvfb-run -a -s "-screen 0 1280x800x24" dbus-run-session -- \
              node tools/verification/qualify-p-current-nix.mjs "$P_SYSTEM" ../nebular "$RUNNER_TEMP/p-nix-evidence"
          else
            node tools/verification/qualify-p-current-nix.mjs "$P_SYSTEM" ../nebular "$RUNNER_TEMP/p-nix-evidence"
          fi
      - name: Retain qualification and failure evidence
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: p-nix-current-${{ matrix.system }}
          path: ${{ runner.temp }}/p-nix-evidence/
          if-no-files-found: warn
