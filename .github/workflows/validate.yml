name: Validate Distribution Packages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-linux:
    name: Validate Linux Packages (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            build_pacman: true
            arch_container: "archlinux:base@sha256:b21322c663be387c0ed9cbc7bbbfe18e41633ad4e7b7c77cfad45f128be20040"
            fedora_container: "fedora@sha256:a651ddf48ea28a06ed4e1e6519f51c9f47e7a5a138722ade87369b8fbb7e5b42"
          - arch: aarch64
            runner: ubuntu-24.04-arm
            build_pacman: false
            fedora_container: "fedora@sha256:a651ddf48ea28a06ed4e1e6519f51c9f47e7a5a138722ade87369b8fbb7e5b42"

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@e50d5f73bfe71c2dd0aa4218de8f4afa59f8f81d # v16

      - name: Checkout Locked Nebular Qualification Source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Knowledge-Forge-AI/theme-forge-nebular-fusion
          ref: 49e2c4919b6b4ec9bd4ed5d7e7ced90921e00f5e
          path: scratch/nebular-release-source
          persist-credentials: false

      - name: Authenticate Nebular Qualification Source
        run: |
          set -euo pipefail
          test "$(git -C scratch/nebular-release-source rev-parse HEAD)" = "$(node -p "require('./release-lock.json').products['theme-forge-nebular-fusion'].releaseCommit")"
          test "$(git -C scratch/nebular-release-source rev-parse HEAD^{tree})" = "$(node -p "require('./release-lock.json').products['theme-forge-nebular-fusion'].releaseTree")"

      - name: Real Nix Build & Verification (${{ matrix.arch }}-linux)
        run: |
          set -euo pipefail
          echo "Building Nix packages for ${{ matrix.arch }}-linux..."
          nix build path:.#tfsb --no-link
          nix build path:.#tfsl --no-link
          nix build path:.#tfss --no-link
          nix build path:.#tfnf --out-link result-tfnf
          nix build path:.#theme-forge-nebular-fusion.payload --out-link result-tfnf-payload
          nix flake check path:. -L

          # Verify Nebular binary byte invariance in wrapped output
          EXPECTED_SHA=$(node -p "require('./release-lock.json').products['theme-forge-nebular-fusion'].rawArchives['${{ matrix.arch }}-linux'].executableSha256")
          ACTUAL_SHA=$(sha256sum result-tfnf-payload/lib/theme-forge-nebular-fusion/bin/theme-forge-nebular-fusion | awk '{print $1}')
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          echo "Nix Nebular executable byte invariance confirmed: $ACTUAL_SHA"

          # Runner-host wrapper probes; bubblewrap must never run in a Nix build check.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          EXPECTED_VERSION=$(node -p "require('./release-lock.json').products['theme-forge-nebular-fusion'].version")
          test "$(./result-tfnf/bin/tfnf --version)" = "theme-forge-nebular-fusion $EXPECTED_VERSION"
          test "$(./result-tfnf/bin/tfnf --path)" = "$(realpath result-tfnf-payload/lib/theme-forge-nebular-fusion/bin/theme-forge-nebular-fusion)"
          # The locked 0.6.1 activation contract refuses before Tauri when no smoke directory exists.
          set +e
          timeout --kill-after=5s 30s env -u TFNF_RELEASE_SMOKE_DIR ./result-tfnf/bin/tfnf --nebular-release-smoke=A > nebular-refusal.log 2>&1
          PROBE_STATUS=$?
          set -e
          test "$PROBE_STATUS" -eq 2
          test "$(cat nebular-refusal.log)" = 'TFSB Studio release smoke refused: release smoke directory is not set'
          rm -f result-tfnf result-tfnf-payload

      - name: Download & Authenticate Locked Upstream Assets
        run: |
          set -euo pipefail
          node tools/verification/fetch-locked-assets.mjs --lock release-lock.json --dest upstream-assets

      - name: Verify Release Lock with Required Assets
        run: |
          set -euo pipefail
          node tools/verification/verify-release-lock.mjs release-lock.json --require-assets --assets-dir upstream-assets

      - name: Validate Committed Production Public Key Trust Anchor
        env:
          PRODUCTION_PRIMARY_FPR: 7D03EE84F8C7025FD2F3D772BF89DF6643C2F1AF
          PRODUCTION_SIGNING_SUBKEY_FPR: C021E00EE3D37C459B0E1CB3199F8028126E8A8C
        run: |
          set -euo pipefail
          echo "Validating committed production public key trust anchor..."
          # 1. Assert plain OpenPGP armor header on line 1 with zero prepended non-armor comments
          FIRST_LINE=$(head -n 1 keys/knowledge-forge-ai-packages.asc)
          test "$FIRST_LINE" = "-----BEGIN PGP PUBLIC KEY BLOCK-----"

          # 2. The reviewed workflow pins production identity; metadata is explanatory.
          node tools/verification/verify-public-key-bootstrap.mjs keys/knowledge-forge-ai-packages.asc --expected-fpr "$PRODUCTION_PRIMARY_FPR"

          # 3. Clean keyring import test
          CLEAN_GNUPGHOME=$(mktemp -d)
          trap 'gpgconf --homedir "$CLEAN_GNUPGHOME" --kill all; rm -rf "$CLEAN_GNUPGHOME"' EXIT
          GNUPGHOME="$CLEAN_GNUPGHOME" gpg --batch --quiet --import keys/knowledge-forge-ai-packages.asc
          GNUPGHOME="$CLEAN_GNUPGHOME" gpg --batch --quiet --with-colons --with-subkey-fingerprint --list-keys > "$CLEAN_GNUPGHOME/keys.colons"
          awk -F: -v primary="$PRODUCTION_PRIMARY_FPR" -v signing="$PRODUCTION_SIGNING_SUBKEY_FPR" '
            $1 == "pub" { pubs++; current = "pub"; next }
            $1 == "sub" { current = "sub"; valid = ($2 !~ /^[red]$/ && $12 ~ /[sS]/ && ($7 == "" || $7 > systime())); next }
            $1 == "fpr" && current == "pub" { primary_ok = ($10 == primary); current = ""; next }
            $1 == "fpr" && current == "sub" { if (valid && $10 == signing) signing_ok = 1; current = "" }
            END { exit !(pubs == 1 && primary_ok && signing_ok) }
          ' "$CLEAN_GNUPGHOME/keys.colons"
          echo "Committed production public key validated successfully."

      - name: Generate Ephemeral Validation Signing Key
        run: |
          set -euo pipefail
          mkdir -p scratch/signing test-fixtures/signing
          GNUPGHOME="$(pwd)/scratch/signing"
          export GNUPGHOME
          printf '%s\n' \
            '%no-protection' \
            'Key-Type: RSA' \
            'Key-Length: 2048' \
            'Subkey-Type: RSA' \
            'Subkey-Length: 2048' \
            'Subkey-Usage: sign' \
            'Name-Real: Theme Forge Validation Fixture' \
            'Name-Email: validation@knowledgeforge.ai' \
            'Expire-Date: 1d' \
            '%commit' > /tmp/gpg-gen.conf
          gpg --batch --gen-key /tmp/gpg-gen.conf
          rm -f /tmp/gpg-gen.conf
          FIXTURE_FPR=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')
          echo "FIXTURE_FPR=$FIXTURE_FPR" >> "$GITHUB_ENV"
          gpg --armor --export "$FIXTURE_FPR" > test-fixtures/signing/fixture-public-key.asc
          gpg --armor --export-secret-keys "$FIXTURE_FPR" > test-fixtures/signing/fixture-signing-key.asc
          echo "Generated ephemeral validation key with fingerprint: $FIXTURE_FPR"

      - name: Real RPM Build & Sign (Fedora Container)
        run: |
          set -euo pipefail
          mkdir -p scratch/rpm/${{ matrix.arch }}
          docker run --rm \
            -v "$(pwd):/workspace" \
            -w /workspace \
            ${{ matrix.fedora_container }} \
            sh -c "
              set -euo pipefail
              dnf install -y -q rpm-build rpmlint createrepo_c gnupg rpmsign

              # Setup rpmbuild trees
              mkdir -p /root/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
              cp templates/rpm/*.spec /root/rpmbuild/SPECS/
              cp templates/desktop/* /root/rpmbuild/SOURCES/
              cp templates/icons/* /root/rpmbuild/SOURCES/
              cp upstream-assets/* /root/rpmbuild/SOURCES/

              rpmlint /root/rpmbuild/SPECS/*.spec

              # Build noarch packages on runner
              rpmbuild -ba --target noarch /root/rpmbuild/SPECS/theme-forge-stellar-loom.spec
              rpmbuild -ba --target noarch /root/rpmbuild/SPECS/theme-forge-solar-sail.spec
              cp /root/rpmbuild/RPMS/noarch/*.rpm scratch/rpm/${{ matrix.arch }}/

              # Build architecture-specific packages
              rpmbuild -ba --target ${{ matrix.arch }} /root/rpmbuild/SPECS/theme-forge-stellar-burst.spec
              rpmbuild -ba --target ${{ matrix.arch }} /root/rpmbuild/SPECS/theme-forge-nebular-fusion.spec
              cp /root/rpmbuild/RPMS/${{ matrix.arch }}/*.rpm scratch/rpm/${{ matrix.arch }}/

              # Import fixture keys for signing
              gpg --batch --import test-fixtures/signing/fixture-signing-key.asc
              gpg --batch --import test-fixtures/signing/fixture-public-key.asc
              FPR=\$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print \$10; exit}')

              echo '%_signature gpg' > /root/.rpmmacros
              echo \"%_gpg_name \$FPR\" >> /root/.rpmmacros

              # Sign every built RPM with fixture key
              rpmsign --addsign scratch/rpm/${{ matrix.arch }}/*.rpm

              # Generate repository metadata and sign repomd
              createrepo_c scratch/rpm/${{ matrix.arch }}
              gpg --batch --yes --detach-sign --armor -u \"\$FPR\" scratch/rpm/${{ matrix.arch }}/repodata/repomd.xml

              # Prove committed production public key imports successfully via RPM path
              rpm --import /workspace/keys/knowledge-forge-ai-packages.asc

              # Verify RPM internal signatures with only public key
              rpm --import test-fixtures/signing/fixture-public-key.asc
              rpm --checksig scratch/rpm/${{ matrix.arch }}/*.rpm
              gpg --batch --verify scratch/rpm/${{ matrix.arch }}/repodata/repomd.xml.asc scratch/rpm/${{ matrix.arch }}/repodata/repomd.xml
            "

      - name: Clean-Container RPM Installation & Binary Verification
        run: |
          set -euo pipefail
          mkdir -p scratch/nebular-smoke
          docker run --rm --init \
            -v "$(pwd)/scratch/rpm/${{ matrix.arch }}:/repo:ro" \
            -v "$(pwd)/test-fixtures/signing/fixture-public-key.asc:/etc/pki/rpm-gpg/RPM-GPG-KEY-kfa:ro" \
            -v "$(pwd)/release-lock.json:/workspace/release-lock.json:ro" \
            -v "$(pwd)/scratch/nebular-release-source:/nebular-source:ro" \
            -v "$(pwd)/scratch/nebular-smoke:/smoke-evidence" \
            ${{ matrix.fedora_container }} \
            sh -c "
              set -euo pipefail
              rpm --import /etc/pki/rpm-gpg/RPM-GPG-KEY-kfa

              printf '%s\n' \
                '[local-test]' \
                'name=Local Test Repository' \
                'baseurl=file:///repo' \
                'enabled=1' \
                'gpgcheck=1' \
                'repo_gpgcheck=1' \
                'gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-kfa' > /etc/yum.repos.d/local.repo

              dnf install -y -q theme-forge-stellar-burst theme-forge-nebular-fusion theme-forge-stellar-loom theme-forge-solar-sail
              tfsl --version | grep '0.4.0'
              set +e
              tfsl-batch </dev/null > /tmp/loom-empty.json
              BATCH_STATUS=\$?
              set -e
              test \"\$BATCH_STATUS\" -eq 1
              node -e 'const assert = require(\"node:assert/strict\"); const r = require(\"/tmp/loom-empty.json\"); assert.equal(r.error.code, \"EMPTY_INPUT\"); assert.equal(r.status, \"error\"); assert.equal(r.valid, false);'
              tfss --version | grep '0.2.1'
              tfsb --version | grep '0.6.1'
              tfsb-studio-service </dev/null >/dev/null
              # The public entry must target the released shell launcher, never the GUI.
              test \"\$(readlink /usr/bin/tfnf)\" = /usr/lib/theme-forge-nebular-fusion/bin/tfnf
              test -x /usr/lib/theme-forge-nebular-fusion/bin/tfnf
              test -x /usr/lib/theme-forge-nebular-fusion/bin/theme-forge-nebular-fusion
              test -x /usr/lib/theme-forge-nebular-fusion/bin/tfsb-studio-service
              EXPECTED_VERSION=\$(node -p \"require('/workspace/release-lock.json').products['theme-forge-nebular-fusion'].version\")
              test \"\$(tfnf --version)\" = \"theme-forge-nebular-fusion \$EXPECTED_VERSION\"
              test \"\$(tfnf --path)\" = /usr/lib/theme-forge-nebular-fusion/bin/theme-forge-nebular-fusion

              # Verify Nebular binary byte identity against locked raw binary dynamically
              ACTUAL_SHA=\$(sha256sum /usr/lib/theme-forge-nebular-fusion/bin/theme-forge-nebular-fusion | awk '{print \$1}')
              EXPECTED_SHA=\$(node -p \"require('/workspace/release-lock.json').products['theme-forge-nebular-fusion'].rawArchives['${{ matrix.arch }}-linux'].executableSha256\")
              test \"\$ACTUAL_SHA\" = \"\$EXPECTED_SHA\"
              echo 'RPM Nebular binary byte invariance confirmed: '\$ACTUAL_SHA

              # Locked 0.6.1 refusal path loads the GUI without initializing Tauri.
              set +e
              timeout --kill-after=5s 30s env -u TFNF_RELEASE_SMOKE_DIR tfnf --nebular-release-smoke=A > /tmp/nebular-refusal.log 2>&1
              PROBE_STATUS=\$?
              set -e
              test \"\$PROBE_STATUS\" -eq 2
              test \"\$(cat /tmp/nebular-refusal.log)\" = 'TFSB Studio release smoke refused: release smoke directory is not set'

              # Reuse the released root-container Xvfb/dbus contract on the installed payload.
              dnf install -y -q xorg-x11-server-Xvfb xorg-x11-xauth dbus-daemon procps-ng
              mkdir -p /smoke-evidence/rpm-${{ matrix.arch }}
              env WEBKIT_DISABLE_COMPOSITING_MODE=1 WEBKIT_DISABLE_DMABUF_RENDERER=1 xvfb-run -a -s \"-screen 0 1280x800x24\" dbus-run-session -- node /nebular-source/tools/native-rc-smoke.mjs --platform ${{ matrix.arch == 'x86_64' && 'linux-x64' || 'linux-arm64' }} --scenario ${{ matrix.arch == 'x86_64' && 'C' || 'B' }} --launch-root /usr/lib/theme-forge-nebular-fusion --checkout /nebular-source --evidence /smoke-evidence/rpm-${{ matrix.arch }} --source dist1-rpm --label rpm-${{ matrix.arch }}
              test \"\$(sha256sum /usr/lib/theme-forge-nebular-fusion/bin/theme-forge-nebular-fusion | cut -d ' ' -f 1)\" = \"\$EXPECTED_SHA\"

              # Clean uninstall and readback
              dnf remove -y -q theme-forge-stellar-burst theme-forge-nebular-fusion theme-forge-stellar-loom theme-forge-solar-sail
              test ! -e /usr/bin/tfsb && test ! -L /usr/bin/tfsb
              test ! -e /usr/bin/tfnf && test ! -L /usr/bin/tfnf
            "

      - name: RPM Signature Tamper Test (Fail-Closed Enforcement)
        run: |
          set -euo pipefail
          mkdir -p scratch/rpm-tamper
          cp -r scratch/rpm/${{ matrix.arch }}/* scratch/rpm-tamper/

          # Test 1: Corrupt first RPM file
          TARGET_RPM=$(find scratch/rpm-tamper -name "*.rpm" | head -n 1)
          echo 'X' >> "$TARGET_RPM"

          docker run --rm \
            -v "$(pwd)/scratch/rpm-tamper:/repo:ro" \
            -v "$(pwd)/test-fixtures/signing/fixture-public-key.asc:/etc/pki/rpm-gpg/RPM-GPG-KEY-kfa:ro" \
            ${{ matrix.fedora_container }} \
            sh -c '
              set -e
              rpm --import /etc/pki/rpm-gpg/RPM-GPG-KEY-kfa
              TARGET=$(ls /repo/*.rpm | head -n 1)
              OUTPUT=$(rpm --checksig "$TARGET" 2>&1 || true)
              if echo "$OUTPUT" | grep -qiE "NOT OK|BAD|FAIL|digest mismatch"; then
                echo "[PASS] rpm --checksig correctly rejected tampered RPM fail-closed: $OUTPUT"
              else
                echo "TAMPER ERROR: rpm --checksig did not reject for signature failure. Output: $OUTPUT" >&2
                exit 1
              fi
            '

          # Test 2: Corrupt repomd.xml.asc
          mkdir -p scratch/rpm-tamper-repomd
          cp -r scratch/rpm/${{ matrix.arch }}/* scratch/rpm-tamper-repomd/
          echo 'CORRUPT' >> scratch/rpm-tamper-repomd/repodata/repomd.xml.asc

          docker run --rm \
            -v "$(pwd)/scratch/rpm-tamper-repomd:/repo:ro" \
            -v "$(pwd)/test-fixtures/signing/fixture-public-key.asc:/etc/pki/rpm-gpg/RPM-GPG-KEY-kfa:ro" \
            ${{ matrix.fedora_container }} \
            sh -c '
              set -e
              printf "%s\n" \
                "[local-test]" \
                "name=Local Test" \
                "baseurl=file:///repo" \
                "enabled=1" \
                "gpgcheck=1" \
                "repo_gpgcheck=1" \
                "gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-kfa" > /etc/yum.repos.d/local.repo
              OUTPUT=$(dnf --refresh check-update 2>&1 || true)
              if echo "$OUTPUT" | grep -qiE "signature|GPG|key|repomd|verification failed|BAD"; then
                echo "[PASS] DNF rejected corrupted repomd.xml.asc fail-closed: $OUTPUT"
              else
                echo "TAMPER ERROR: DNF did not fail for repomd signature reason: $OUTPUT" >&2
                exit 1
              fi
            '
          rm -rf scratch/rpm-tamper scratch/rpm-tamper-repomd

      - name: Real Pacman Build, Sign, and Repository Assembly (Arch Container)
        if: matrix.build_pacman
        run: |
          set -euo pipefail
          mkdir -p scratch/arch/x86_64
          docker run --rm \
            -v "$(pwd):/workspace" \
            -w /workspace \
            ${{ matrix.arch_container }} \
            sh -c "
              set -euo pipefail
              pacman -Syu --noconfirm base-devel pacman-contrib gnupg sudo

              useradd -m builder && echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
              chown -R builder:builder /workspace/scratch/arch

              # Import fixture keys for builder
              su builder -c '
                set -euo pipefail
                gpg --batch --import /workspace/test-fixtures/signing/fixture-signing-key.asc
                gpg --batch --import /workspace/test-fixtures/signing/fixture-public-key.asc
              '

              # Build all 4 packages using real makepkg
              for pkgdir in templates/pacman/*; do
                if [ -d \"\$pkgdir\" ]; then
                  pkgname=\$(basename \"\$pkgdir\")
                  echo \"Building Pacman package: \$pkgname\"
                  mkdir -p /home/builder/build/\$pkgname
                  cp -r \"\$pkgdir/\"* /home/builder/build/\$pkgname/
                  cp -r /workspace/upstream-assets/* /home/builder/build/\$pkgname/
                  chown -R builder:builder /home/builder/build/\$pkgname

                  su builder -c \"
                    set -euo pipefail
                    cd /home/builder/build/\$pkgname
                    makepkg -s --noconfirm
                    cp *.pkg.tar.zst /workspace/scratch/arch/x86_64/
                  \"
                fi
              done

              # Sign each built package with fixture key
              su builder -c '
                set -euo pipefail
                cd /workspace/scratch/arch/x86_64
                FPR=\$(gpg --list-secret-keys --with-colons | awk -F: '\''/^fpr/{print \$10; exit}'\'')
                for pkg in *.pkg.tar.zst; do
                  gpg --batch --yes --detach-sign -u \"\$FPR\" \"\$pkg\"
                done
                repo-add -s -k \"\$FPR\" knowledge-forge-ai.db.tar.gz *.pkg.tar.zst
              '

              # Verify all detached signatures with public key only
              su builder -c '
                set -euo pipefail
                export GNUPGHOME=\$(mktemp -d)
                gpg --batch --import /workspace/test-fixtures/signing/fixture-public-key.asc
                cd /workspace/scratch/arch/x86_64
                for sig in *.sig; do
                  target=\"\${sig%.sig}\"
                  gpg --batch --verify \"\$sig\" \"\$target\"
                done
                echo \"[PASS] All pacman package and DB signatures verified with fixture public key.\"
              '
            "

      - name: Clean-Container Pacman Installation & Binary Verification
        if: matrix.build_pacman
        run: |
          set -euo pipefail
          mkdir -p scratch/nebular-smoke
          docker run --rm --init \
            -v "$(pwd)/scratch/arch/x86_64:/repo:ro" \
            -v "$(pwd)/test-fixtures/signing/fixture-public-key.asc:/tmp/kfa.asc:ro" \
            -v "$(pwd)/keys/knowledge-forge-ai-packages.asc:/tmp/prod-key.asc:ro" \
            -v "$(pwd)/release-lock.json:/workspace/release-lock.json:ro" \
            -v "$(pwd)/scratch/nebular-release-source:/nebular-source:ro" \
            -v "$(pwd)/scratch/nebular-smoke:/smoke-evidence" \
            ${{ matrix.arch_container }} \
            sh -c "
              set -euo pipefail
              pacman-key --init
              # Prove committed production public key imports successfully via pacman-key path
              pacman-key --add /tmp/prod-key.asc

              # Import ephemeral fixture key to trust locally built validation packages
              pacman-key --add /tmp/kfa.asc
              FPR=\$(gpg --show-keys --with-colons /tmp/kfa.asc | awk -F: '/^fpr/{print \$10; exit}')
              pacman-key --lsign-key \"\$FPR\"

              printf '%s\n' '' '[knowledge-forge-ai]' 'SigLevel = Required DatabaseRequired TrustedOnly' 'Server = file:///repo' >> /etc/pacman.conf

              # Keep the pinned base synchronized before installing extra smoke tools.
              pacman -Syu --noconfirm theme-forge-stellar-burst theme-forge-stellar-loom theme-forge-solar-sail theme-forge-nebular-fusion

              tfsb --version | grep '0.6.1'
              tfsb-studio-service </dev/null >/dev/null
              tfsl --version | grep '0.4.0'
              set +e
              tfsl-batch </dev/null > /tmp/loom-empty.json
              BATCH_STATUS=\$?
              set -e
              test \"\$BATCH_STATUS\" -eq 1
              node -e 'const assert = require(\"node:assert/strict\"); const r = require(\"/tmp/loom-empty.json\"); assert.equal(r.error.code, \"EMPTY_INPUT\"); assert.equal(r.status, \"error\"); assert.equal(r.valid, false);'
              tfss --version | grep '0.2.1'
              # The public entry must target the released shell launcher, never the GUI.
              test \"\$(readlink /usr/bin/tfnf)\" = /usr/lib/theme-forge-nebular-fusion/bin/tfnf
              test -x /usr/lib/theme-forge-nebular-fusion/bin/tfnf
              test -x /usr/lib/theme-forge-nebular-fusion/bin/theme-forge-nebular-fusion
              test -x /usr/lib/theme-forge-nebular-fusion/bin/tfsb-studio-service
              EXPECTED_VERSION=\$(node -p \"require('/workspace/release-lock.json').products['theme-forge-nebular-fusion'].version\")
              test \"\$(tfnf --version)\" = \"theme-forge-nebular-fusion \$EXPECTED_VERSION\"
              test \"\$(tfnf --path)\" = /usr/lib/theme-forge-nebular-fusion/bin/theme-forge-nebular-fusion

              ACTUAL_SHA=\$(sha256sum /usr/lib/theme-forge-nebular-fusion/bin/theme-forge-nebular-fusion | awk '{print \$1}')
              EXPECTED_SHA=\$(node -p \"require('/workspace/release-lock.json').products['theme-forge-nebular-fusion'].rawArchives['x86_64-linux'].executableSha256\")
              test \"\$ACTUAL_SHA\" = \"\$EXPECTED_SHA\"
              echo 'Pacman Nebular binary byte invariance confirmed: '\$ACTUAL_SHA

              # Locked 0.6.1 refusal path loads the GUI without initializing Tauri.
              set +e
              timeout --kill-after=5s 30s env -u TFNF_RELEASE_SMOKE_DIR tfnf --nebular-release-smoke=A > /tmp/nebular-refusal.log 2>&1
              PROBE_STATUS=\$?
              set -e
              test \"\$PROBE_STATUS\" -eq 2
              test \"\$(cat /tmp/nebular-refusal.log)\" = 'TFSB Studio release smoke refused: release smoke directory is not set'

              # Reuse the released root-container Xvfb/dbus contract on the installed payload.
              pacman -S --noconfirm xorg-server-xvfb xorg-xauth dbus procps-ng
              mkdir -p /smoke-evidence/pacman-x86_64
              env WEBKIT_DISABLE_COMPOSITING_MODE=1 WEBKIT_DISABLE_DMABUF_RENDERER=1 xvfb-run -a -s \"-screen 0 1280x800x24\" dbus-run-session -- node /nebular-source/tools/native-rc-smoke.mjs --platform linux-x64 --scenario C --launch-root /usr/lib/theme-forge-nebular-fusion --checkout /nebular-source --evidence /smoke-evidence/pacman-x86_64 --source dist1-pacman --label pacman-x86_64
              test \"\$(sha256sum /usr/lib/theme-forge-nebular-fusion/bin/theme-forge-nebular-fusion | cut -d ' ' -f 1)\" = \"\$EXPECTED_SHA\"

              # Clean uninstall and readback
              pacman -R --noconfirm theme-forge-stellar-burst theme-forge-stellar-loom theme-forge-solar-sail theme-forge-nebular-fusion
              test ! -e /usr/bin/tfsb && test ! -L /usr/bin/tfsb
              test ! -e /usr/bin/tfnf && test ! -L /usr/bin/tfnf
            "

      - name: Pacman Tamper Test (Fail-Closed Signature Rejection)
        if: matrix.build_pacman
        run: |
          set -euo pipefail
          mkdir -p scratch/arch-tamper
          cp -r scratch/arch/x86_64/* scratch/arch-tamper/

          # Test 1: Corrupt one package
          TARGET_PKG=$(find scratch/arch-tamper -name "*.pkg.tar.zst" | head -n 1)
          echo 'CORRUPT' >> "$TARGET_PKG"

          docker run --rm \
            -v "$(pwd)/scratch/arch-tamper:/repo:ro" \
            -v "$(pwd)/test-fixtures/signing/fixture-public-key.asc:/tmp/kfa.asc:ro" \
            -e TARGET_PKG="$(basename "$TARGET_PKG")" \
            ${{ matrix.arch_container }} \
            sh -c '
              set -e
              pacman-key --init
              pacman-key --add /tmp/kfa.asc
              FPR=$(gpg --show-keys --with-colons /tmp/kfa.asc | awk -F: '\''/^fpr/{print $10; exit}'\'')
              pacman-key --lsign-key "$FPR"

              printf "%s\n" "" "[knowledge-forge-ai]" "SigLevel = Required DatabaseRequired TrustedOnly" "Server = file:///repo" >> /etc/pacman.conf

              pacman -Sy --noconfirm
              PKG_BASE=$(echo "$TARGET_PKG" | sed -E "s/-[0-9].*//")
              OUTPUT=$(pacman -S --noconfirm "$PKG_BASE" 2>&1 || true)
              if echo "$OUTPUT" | grep -qiE "invalid or corrupted|corrupted|PGP signature|error: failed to commit transaction"; then
                echo "[PASS] pacman rejected tampered package fail-closed: $OUTPUT"
              else
                echo "TAMPER ERROR: pacman did not reject for corruption/signature reason: $OUTPUT" >&2
                exit 1
              fi
            '

          # Test 2: Corrupt DB signature
          mkdir -p scratch/arch-tamper-db
          cp -r scratch/arch/x86_64/* scratch/arch-tamper-db/
          echo 'CORRUPT' >> scratch/arch-tamper-db/knowledge-forge-ai.db.tar.gz.sig

          docker run --rm \
            -v "$(pwd)/scratch/arch-tamper-db:/repo:ro" \
            -v "$(pwd)/test-fixtures/signing/fixture-public-key.asc:/tmp/kfa.asc:ro" \
            ${{ matrix.arch_container }} \
            sh -c '
              set -e
              pacman-key --init
              pacman-key --add /tmp/kfa.asc
              FPR=$(gpg --show-keys --with-colons /tmp/kfa.asc | awk -F: '\''/^fpr/{print $10; exit}'\'')
              pacman-key --lsign-key "$FPR"

              printf "%s\n" "" "[knowledge-forge-ai]" "SigLevel = Required DatabaseRequired TrustedOnly" "Server = file:///repo" >> /etc/pacman.conf

              OUTPUT=$(pacman -Sy --noconfirm 2>&1 || true)
              if echo "$OUTPUT" | grep -qiE "invalid or corrupted|corrupted|PGP signature|failed to update"; then
                echo "[PASS] pacman rejected corrupted DB signature fail-closed: $OUTPUT"
              else
                echo "TAMPER ERROR: pacman did not reject for DB signature reason: $OUTPUT" >&2
                exit 1
              fi
            '
          rm -rf scratch/arch-tamper scratch/arch-tamper-db

      - name: Real AUR Validation in Arch Container
        if: matrix.build_pacman
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$(pwd):/workspace" \
            -w /workspace \
            ${{ matrix.arch_container }} \
            sh -c "
              set -euo pipefail
              pacman -Syu --noconfirm base-devel pacman-contrib namcap sudo

              useradd -m builder && echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers

              for dir in aur/*; do
                if [ -d \"\$dir\" ]; then
                  echo \"=== Validating AUR recipe: \$dir ===\"
                  mkdir -p /home/builder/aurbuild
                  cp -a \"\$dir/.\" /home/builder/aurbuild/
                  cp -r /workspace/upstream-assets/* /home/builder/aurbuild/
                  chown -R builder:builder /home/builder/aurbuild

                  su builder -c '
                    set -euo pipefail
                    cd /home/builder/aurbuild
                    makepkg --verifysource
                    makepkg --printsrcinfo > .SRCINFO.gen
                    diff -u .SRCINFO .SRCINFO.gen
                    echo \"[PASS] .SRCINFO is bit-for-bit identical to committed .SRCINFO\"
                    namcap PKGBUILD
                  '
                  rm -rf /home/builder/aurbuild
                fi
              done
            "

      - name: Retain Validation Receipts
        if: always()
        env:
          VALIDATION_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p scratch/provenance
          echo "{\"validationTimestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\", \"arch\": \"${{ matrix.arch }}\", \"status\": \"$VALIDATION_STATUS\"}" > scratch/provenance/validation-receipt-${{ matrix.arch }}.json

      - name: Upload Test Verification Receipts
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: validation-receipts-${{ matrix.arch }}
          path: scratch/provenance/
          if-no-files-found: error

      - name: Upload Nebular Runtime Smoke Evidence
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: nebular-smoke-linux-${{ matrix.arch }}
          path: scratch/nebular-smoke/
          if-no-files-found: warn

  validate-nix-darwin:
    name: Validate Hosted Nix on macOS (aarch64-darwin)
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@e50d5f73bfe71c2dd0aa4218de8f4afa59f8f81d # v16

      - name: Checkout Locked Nebular Qualification Source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Knowledge-Forge-AI/theme-forge-nebular-fusion
          ref: 49e2c4919b6b4ec9bd4ed5d7e7ced90921e00f5e
          path: scratch/nebular-release-source
          persist-credentials: false

      - name: Authenticate Nebular Qualification Source
        run: |
          set -euo pipefail
          test "$(git -C scratch/nebular-release-source rev-parse HEAD)" = "$(node -p "require('./release-lock.json').products['theme-forge-nebular-fusion'].releaseCommit")"
          test "$(git -C scratch/nebular-release-source rev-parse HEAD^{tree})" = "$(node -p "require('./release-lock.json').products['theme-forge-nebular-fusion'].releaseTree")"

      - name: Real Nix Build & Verification (aarch64-darwin)
        run: |
          set -euo pipefail
          echo "Building Nix packages on macOS 15..."
          nix build path:.#tfsb --no-link
          nix build path:.#tfsl --no-link
          nix build path:.#tfss --no-link
          nix build path:.#tfnf --out-link result-tfnf
          nix flake check path:. -L

          # Verify Darwin .app structure and launcher
          APP_PATH="result-tfnf/Applications/Theme Forge Nebular Fusion.app"
          test -d "$APP_PATH"
          test -L "result-tfnf/bin/tfnf"

          # Assert the launcher target before any invocation; metadata must not start the GUI.
          test "$(readlink result-tfnf/bin/tfnf)" = "$(realpath "$APP_PATH")/Contents/Resources/bin/tfnf"
          test -x "$APP_PATH/Contents/Resources/bin/tfnf"
          test -x "$APP_PATH/Contents/MacOS/tfsb-studio-service"
          EXPECTED_VERSION=$(node -p "require('./release-lock.json').products['theme-forge-nebular-fusion'].version")
          test "$(./result-tfnf/bin/tfnf --version)" = "theme-forge-nebular-fusion $EXPECTED_VERSION"
          test "$(./result-tfnf/bin/tfnf --path)" = "$(realpath "$APP_PATH/Contents/MacOS/theme-forge-nebular-fusion")"

          # Verify binary byte identity against locked Darwin executable
          RAW_EXE="$APP_PATH/Contents/MacOS/theme-forge-nebular-fusion"
          ACTUAL_SHA=$(shasum -a 256 "$RAW_EXE" | awk '{print $1}')
          EXPECTED_SHA=$(node -p "require('./release-lock.json').products['theme-forge-nebular-fusion'].rawArchives['aarch64-darwin'].executableSha256")
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          echo "[PASS] macOS Nebular binary byte invariance confirmed: $ACTUAL_SHA"

          # Node supplies a bounded process timeout on macOS (no GNU timeout dependency).
          node -e 'const {spawnSync} = require("node:child_process"); const assert = require("node:assert/strict"); const env = {...process.env}; delete env.TFNF_RELEASE_SMOKE_DIR; const r = spawnSync(process.argv[1], ["--nebular-release-smoke=A"], {env, encoding: "utf8", timeout: 30000, killSignal: "SIGKILL"}); assert.ifError(r.error); assert.equal(r.signal, null); assert.equal(r.status, 2); assert.equal(r.stdout, ""); assert.equal(r.stderr.trim(), "TFSB Studio release smoke refused: release smoke directory is not set");' ./result-tfnf/bin/tfnf

          # Real application runtime qualification uses the released harness on the store bundle.
          node scratch/nebular-release-source/tools/native-rc-smoke.mjs --platform darwin-arm64 --scenario A --launch-root "$(realpath result-tfnf/Applications)" --checkout scratch/nebular-release-source --evidence scratch/nebular-smoke/darwin --source dist1-nix-darwin --label nix-darwin
          test "$(shasum -a 256 "$RAW_EXE" | awk '{print $1}')" = "$EXPECTED_SHA"
          rm -f result-tfnf

      - name: Upload Nebular Runtime Smoke Evidence
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: nebular-smoke-darwin-aarch64
          path: scratch/nebular-smoke/
          if-no-files-found: warn
